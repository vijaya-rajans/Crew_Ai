trend_hunting_task:
  description: >
    Scour the web, Google News, and tech blogs to find the absolute latest AI news updates. 
    Focus heavily on major core model updates, trending new features in AI image generation tools 
    (like Midjourney, Stable Diffusion, DALL-E, etc.), and AI video generation tools (like Sora, Runway, Luma, etc.).
    
    CRITICAL RULE: Check the timestamps of every article. Completely ignore, filter out, and drop 
    any news, content, or updates that were published more than 7 days ago. Only pull data from the last 7 days.
  expected_output: >
    A structured list of raw breakthrough AI news and image/video trends found, complete with source titles and 
    dates, ensuring everything is strictly under 1 week old.
  agent: trend_hunter

social_monitoring_task:
  description: >
    Investigate what experienced AI creators, YouTubers, and Instagram content creators are talking about right now. 
    Look for their newest video topics, tutorials, and reactions regarding AI tool workflows.
    
    CRITICAL RULE: Check upload dates meticulously. If a video, post, or update is older than 7 days, 
    discard it immediately. Focus only on what creators have put out within the last week.
  expected_output: >
    A bulleted summary showing what top creators are currently focusing on, what tools they are experimenting with this week, 
    and links or references to their latest weekly uploads.
  agent: social_monitor

editorial_task:
  description: >
    Review all the data gathered by the Trend Hunter and the Social Monitor. 
    1. Cross-reference the notes to remove any duplicate news items.
    2. Do a final strict date audit: scrub away any information that accidentally sneaked through from before the past 7 days.
    3. Organize the final results into a beautiful, easy-to-read, high-signal intelligence briefing markdown report.
  expected_output: >
    A perfectly formatted Markdown report (.md) containing sections for:
    - 🚀 Major AI Core Updates (This Week Only)
    - 🎨 Image & Video Generation Trends (Last 7 Days)
    - 🎥 What Top AI Creators are Talking About / Making Videos on
    - 💡 Key Takeaways for the Week.
    No fluff, no outdated information.
  agent: chief_editor

scriptwriting_task:
  description: >
    Review the final markdown intelligence briefing generated by the chief editor. 
    Pick out the top 2 or 3 most shocking, impactful, or exciting AI tool updates or image/video trends from the last 7 days.
    
    Convert these trends into a highly engaging Short-Form Video Script (for YouTube Shorts or Instagram Reels).
    The script must contain:
    1. A powerful hook in the first 3 seconds to pull in tech lovers and creators.
    2. Body content that breaks down the updates simply, creating curiosity without sounding desperate.
    3. Visual cues in brackets [like this] instructing what should be displayed on the screen.
    4. A strong, organic call-to-action (CTA) at the end.
  expected_output: >
    A perfectly formatted production script saved as a markdown file, ready for a creator to read on camera, complete with timestamp cues and on-screen asset notes.
  agent: content_scriptwriter